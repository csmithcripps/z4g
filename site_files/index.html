<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Z4G's Wizard Tower</title>
    <link rel="stylesheet" href="src/css/main.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
</head>

<body>
    <div id="topbar"></div>
    <div id="container">
        <div id="header"></div>
        <div id="flex">

            <rightBody>
                <div class="articletop"></div>
                <main>
                    <div id="intro"></div>
                </main>
                <div class="articlebottom"></div>

                <div class="articletop"></div>
                <main>
                    <div id="guestbook"></div>
                    <h1 align="center">Void Whispers</h1>
                    <h3 align="center">Recently the void has sounded like</h3>

                    <div align="center" class="git-commits"></div>
                    <script>
                        var xmlhttp = new XMLHttpRequest();
                        xmlhttp.onreadystatechange = function () {
                            if (this.readyState == 4 && this.status == 200) {
                                parse_entry(this);
                            }
                        };
                        xmlhttp.open("GET", "https://github.com/csmithcripps/z4g/commits/main.atom", true);
                        xmlhttp.send();

                        function parse_entry(xml) {
                            var x, i, xmlDoc, txt;
                            xmlDoc = xml.responseXML;
                            txt = "";
                            x = xmlDoc.getElementsByTagName("title");
                            for (i = 0; i < x.length; i++) {
                                txt += x[i].childNodes[0].nodeValue + "<br>";
                            }
                            document.getElementById("git-commits").innerHTML = txt;
                        }
                    </script>
                </main>
                <div class="articlebottom"></div>
                <div class="articletop"></div>
                <main>
                    <h1 align="center">Mastering the Web</h1>
                    <h3 align="center">Though far from mastery, here are some changes that have been made to this part
                        of the web</h3>

                    <div align="center" class="git-commits"></div>
                    <script>
                        var xmlhttp = new XMLHttpRequest();
                        xmlhttp.onreadystatechange = function () {
                            if (this.readyState == 4 && this.status == 200) {
                                parse_entry(this);
                            }
                        };
                        xmlhttp.open("GET", "https://github.com/csmithcripps/z4g/commits/main.atom", true);
                        xmlhttp.send();

                        function parse_entry(xml) {
                            var x, i, xmlDoc, txt;
                            xmlDoc = xml.responseXML;
                            txt = "";
                            x = xmlDoc.getElementsByTagName("title");
                            for (i = 0; i < x.length; i++) {
                                txt += x[i].childNodes[0].nodeValue + "<br>";
                            }
                            document.getElementById("git-commits").innerHTML = txt;
                        }
                    </script>
                </main>
                <div class="articlebottom"></div>

                <p style="padding-bottom: 2cm;"></p>
            </rightBody>

            <aside id="leftSidebar">
                <div class="articletop"></div>
                <main>
                    <h1 align="center">Are you lost?</h1>
                    <h3 align="center">
                        <a href="index.html">
                            Return to the beginning
                        </a>
                    </h3>
                </main>
                <div class="articlebottom"></div>
                <div class="articletop"></div>
                <main>
                    <div id="scrobbler"></div>
                </main>
                <div class="articlebottom"></div>
            </aside>

        </div>
    </div>
    <script>
        $("#topbar").load("src/partials/topbar.html");
        $("#header").load("src/partials/header.html");
        $("#intro").load("src/partials/intro.html");
        $("#guestbook").load("src/partials/guestbook.html");
        $("#scrobbler").load("src/partials/scrobbler.html");
    </script>
</body>

</html>
