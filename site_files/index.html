<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Z4G's Wizard Tower</title>
    <link rel="stylesheet" href="src/css/main.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
</head>

<body>

    <svg width="0" height="0" style="display: block;">
        <defs>
            <filter id="noise">
                <feTurbulence type="fractalNoise" baseFrequency="19.5" numOctaves="10" result="turbulence" />
                <feComposite operator="in" in="turbulence" in2="SourceAlpha" result="composite" />
                <feColorMatrix in="composite" type="luminanceToAlpha" />
                <feBlend in="SourceGraphic" in2="composite" mode="color-burn" />
            </filter>
            <mask id="shape-mask">
                <radialGradient id="fade-gradient">
                    <stop offset="0%" stop-color="black" stop-opacity="0.6" />
                    <stop offset="65%" stop-color="white" stop-opacity="0.9" />
                    <stop offset="75%" stop-color="white" stop-opacity="1" />
                    </linearGradient>
                    <use href="#circle" fill="url('#fade-gradient')" />
            </mask>
            <ellipse id="circle" cx="50" cy="50" rx="50" ry="50" />
        </defs>
    </svg>

    <div id="topbar"></div>

    <div id="container">
        <!-- <div id="header"></div> -->
        <div id="header2">
            <section>
                <div class="center">
                    <svg class="shape" viewbox="0 0 200 175">
                        <use href="#circle" fill="hsl(269, 65%, 52%)" x="0" y="0" mask="url(#shape-mask)"
                            filter="url('#noise')" />
                    </svg>
                </div>
            </section>
        </div>
        <div id="flex">

            <rightBody>
                <div class="articletop"></div>
                <main>
                    <div id="intro"></div>
                </main>
                <div class="articlebottom"></div>

                <div class="articletop"></div>
                <main>
                    <div id="guestbook"></div>
                </main>
                <div class="articlebottom"></div>

                <p style="padding-bottom: 2cm;"></p>
            </rightBody>

            <aside id="leftSidebar">
                <div class="articletop"></div>
                <main>
                    <h1 align="center">Are you lost?</h1>
                    <h3 align="center">
                        <a href="index.html">
                            Return to the beginning
                        </a>
                    </h3>
                </main>
                <div class="articlebottom"></div>
                <div class="articletop"></div>
                <main>
                    <div id="scrobbler"></div>
                </main>
                <div class="articlebottom"></div>
            </aside>

        </div>
    </div>
    <script>
        $("#topbar").load("src/partials/topbar.html");
        $("#header").load("src/partials/header.html");
        $("#intro").load("src/partials/intro.html");
        $("#guestbook").load("src/partials/guestbook.html");
        $("#scrobbler").load("src/partials/scrobbler.html");
    </script>
</body>

</html>
